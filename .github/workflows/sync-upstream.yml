name: Sync upstream skills

# Copies the skills picked in .github/upstream.json from their upstream repo
# into skills/ and opens a PR when any of them changed.
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync picked skills
        run: python3 .github/scripts/sync_upstream.py

      - name: Check skills
        run: python3 .github/scripts/gen_marketplace.py --check

      # The lock moves on every upstream commit; only open a PR when a skill changed.
      - name: Detect skill changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain skills/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync-upstream
          delete-branch: true
          commit-message: "chore: sync upstream skills"
          title: "chore: sync upstream skills"
          body: |
            Updates the skills picked in `.github/upstream.json` to the upstream commit in `.github/upstream.lock.json`.

            Review the diff, then merge and re-sync the plugin.
